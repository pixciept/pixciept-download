  .btn.bw { background:#4b4e52; }
  .btn:active { opacity:0.85; }
  .hint { color:#7c6f74; font-size:12px; margin-top:-6px; }
  .footer { color:#7c6f74; font-size:11px; margin-top:10px; letter-spacing:1px; }
  #expired { display:none; color:#b3261e; font-size:16px; text-align:center; }
  canvas { display:none; }

  <h1>Your Photo is Ready! 🎉</h1>
  <p>Choose your preferred version</p>
  <div class="photos">
    <div class="photo-card">
      <p class="label">Colored</p>
      <img id="photoColor" alt="Colored photo"/>
      <button class="btn color" onclick="downloadColor()">Download Color</button>
    </div>
    <div class="photo-card">
      <p class="label">Black & White</p>
      <img id="photoBW" alt="B&W photo"/>
      <button class="btn bw" onclick="downloadBW()">Download B&W</button>
    </div>
  </div>
  <p class="hint">iOS: press & hold the photo → Save to Photos</p>
  <p id="expired">This photo has expired (24 hours).</p>
  <p class="footer">Powered by Pixceipt</p>
  <canvas id="canvas"></canvas>
  <script>
    const params=new URLSearchParams(window.location.search);
    const imgUrl=params.get("img"); const ts=params.get("ts");
    const colorImg=document.getElementById("photoColor"); const bwImg=document.getElementById("photoBW");
    function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;}
    const EXPIRY_MS=24*60*60*1000;
    if(ts&&(Date.now()-parseInt(ts))>EXPIRY_MS){document.querySelectorAll(".photo-card").forEach(e=>e.style.display="none");document.getElementById("expired").style.display="block";}
    else if(imgUrl){
      colorImg.src=imgUrl;
      colorImg.onerror=()=>{document.querySelectorAll(".photo-card").forEach(e=>e.style.display="none");document.getElementById("expired").style.display="block";};
      const hh=new Image(); hh.crossOrigin="anonymous";
      hh.onload=function(){try{const cv=document.getElementById("canvas");cv.width=hh.naturalWidth;cv.height=hh.naturalHeight;const x=cv.getContext("2d");x.drawImage(hh,0,0);const d=x.getImageData(0,0,cv.width,cv.height);for(let i=0;i<d.data.length;i+=4){const g=d.data[i]*0.299+d.data[i+1]*0.587+d.data[i+2]*0.114;d.data[i]=d.data[i+1]=d.data[i+2]=g;}x.putImageData(d,0,0);bwImg.src=cv.toDataURL("image/jpeg",0.92);}catch{bwImg.src=imgUrl;bwImg.style.filter="grayscale(100%)";}};
      hh.onerror=()=>{bwImg.src=imgUrl;bwImg.style.filter="grayscale(100%)";};
      hh.src=imgUrl+(imgUrl.includes("?")?"&":"?")+"_t="+Date.now();
    }
    function downloadColor(){if(isIOS()){window.open(imgUrl,"_blank");return;}fetch(imgUrl).then(r=>r.blob()).then(b=>dl(URL.createObjectURL(b),"pixceipt-color.jpg")).catch(()=>window.open(imgUrl,"_blank"));}
    function downloadBW(){const s=bwImg.src;if(!s||!s.startsWith("data:")){window.open(imgUrl,"_blank");return;}if(isIOS()){window.open(s,"_blank");}else{fetch(s).then(r=>r.blob()).then(b=>dl(URL.createObjectURL(b),"pixceipt-bw.jpg")).catch(()=>window.open(s,"_blank"));}}
    function dl(u,n){const a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
  </script>
